<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLMs on Isambard-AI</title>
<meta name="description" content="Measured speed and GPU-hour cost of running large open-weight LLMs on Isambard-AI (GH200) with vLLM, with exact one-command steps per model.">
<style>
:root {
  color-scheme: light;
  --surface-0: #f7f7f5;
  --surface-1: #fcfcfb;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #75746f;
  --grid: #e4e3df;
  --series-1: #2a78d6;
  --series-neutral: #a8a79f;
  --link: #1d5fb0;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface-0: #121211;
    --surface-1: #1a1a19;
    --text-primary: #f0efec;
    --text-secondary: #c3c2b7;
    --text-muted: #9a998f;
    --grid: #2e2e2b;
    --series-1: #3987e5;
    --series-neutral: #6b6a63;
    --link: #6aa7f0;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-0: #121211; --surface-1: #1a1a19;
  --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #9a998f;
  --grid: #2e2e2b; --series-1: #3987e5; --series-neutral: #6b6a63; --link: #6aa7f0;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--surface-0); color: var(--text-primary);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
main { max-width: 960px; margin: 0 auto; padding: 32px 16px 64px; }
h1 { font-size: 28px; line-height: 1.2; margin: 0 0 8px; }
h2 { font-size: 18px; margin: 0 0 4px; }
p { margin: 0 0 12px; color: var(--text-secondary); }
a { color: var(--link); }
.sub { font-size: 15px; max-width: 70ch; margin-top: 16px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin: 24px 0; }
.tile, .card { background: var(--surface-1); border: 1px solid var(--grid); border-radius: 12px; padding: 16px; }
.tile .label { font-size: 13px; color: var(--text-secondary); }
.tile .value { font-size: 36px; font-weight: 650; line-height: 1.15; font-variant-numeric: tabular-nums; }
.tile .note { font-size: 13px; color: var(--text-muted); margin: 2px 0 0; }
.card { margin-bottom: 16px; }
.card .desc { font-size: 14px; color: var(--text-muted); margin-bottom: 8px; }
svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { fill: var(--text-secondary); font: 12px system-ui, sans-serif; }
svg text.val { fill: var(--text-primary); font-weight: 600; font-variant-numeric: tabular-nums; }
svg .grid { stroke: var(--grid); stroke-width: 1; }
svg .mark { fill: var(--series-1); }
svg .dot { fill: var(--series-1); stroke: var(--surface-1); stroke-width: 2px; }
svg .dot.cur { stroke: var(--text); stroke-width: 2.5px; }
svg .mark.neutral { fill: var(--series-neutral); }
svg .mark:hover { opacity: .8; }
.legend { display: flex; gap: 16px; font-size: 13px; color: var(--text-secondary); margin: 4px 0 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.tablewrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; min-width: 440px; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--grid); }
th:first-child, td:first-child { text-align: left; }
th { color: var(--text-secondary); font-weight: 600; }
details summary { cursor: pointer; color: var(--link); font-size: 14px; margin-top: 8px; }
.tip {
  position: fixed; pointer-events: none; z-index: 5; display: none;
  background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--grid);
  border-radius: 8px; padding: 6px 10px; font-size: 13px; box-shadow: 0 2px 8px rgba(0,0,0,.18);
}
.caveats li { color: var(--text-secondary); margin-bottom: 6px; }
footer { margin-top: 32px; font-size: 14px; color: var(--text-muted); }
.switch { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0 0; }
.switch button { font: inherit; font-size: 14px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--grid); background: var(--surface-1); color: var(--text-secondary); cursor: pointer; }
.switch button[aria-selected="true"] { background: var(--series-1); border-color: var(--series-1); color: #fff; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0 0; }
.tabs button { font: inherit; font-size: 14px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--grid); background: var(--surface-1); color: var(--text-secondary); cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--series-1); border-color: var(--series-1); color: #fff; }
.tabs button.home { font-weight: 600; }
pre { background: var(--surface-0); border: 1px solid var(--grid); border-radius: 8px; padding: 12px; overflow-x: auto; font-size: 13px; line-height: 1.5; color: var(--text-primary); margin: 8px 0; }
code { font-size: 0.92em; }
.meta { font-size: 13px; color: var(--text-muted); }
.status { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--grid); color: var(--text-secondary); vertical-align: 2px; margin-left: 6px; }
table.cmp td:last-child, table.cmp th:last-child { text-align: left; }
table.cmp tr.row { cursor: pointer; }
table.cmp tr.row:hover td { background: var(--surface-0); }
.notes li { color: var(--text-secondary); margin-bottom: 6px; }
</style>
</head>
<body>
<main>
  <h1>Large LLMs on Isambard-AI</h1>
  <div class="tabs" role="tablist" aria-label="View" id="tabs"></div>
  <div id="view"></div>
  <footer>
    Source, scripts and raw results:
    <a href="https://github.com/wd7512/how-to-run-llm-on-isambard">github.com/wd7512/how-to-run-llm-on-isambard</a>
  </footer>
</main>
<div class="tip" id="tip" role="tooltip"></div>
<script src="data.js"></script>
<script>
const SITE = window.SITE, MODELS = SITE.models, REPO = SITE.repo;
const byKey = Object.fromEntries(MODELS.map(m => [m.key, m]));
const NS = "http://www.w3.org/2000/svg";
const tip = document.getElementById("tip");
const fmt = (n, d = 0) => n.toLocaleString("en-GB", {minimumFractionDigits: d, maximumFractionDigits: d});
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;"}[c]));

function el(name, attrs, parent) {
  const n = document.createElementNS(NS, name);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
function hover(node, text) {
  node.addEventListener("mousemove", ev => {
    tip.textContent = text; tip.style.display = "block";
    tip.style.left = Math.min(ev.clientX + 14, innerWidth - tip.offsetWidth - 8) + "px";
    tip.style.top = (ev.clientY + 14) + "px";
  });
  node.addEventListener("mouseleave", () => tip.style.display = "none");
}

// ---- charts ---------------------------------------------------------------
function columns(target, data, valueKey, tipFn, decimals) {
  const W = 640, H = 240, L = 48, R = 12, T = 24, B = 40;
  const max = Math.max(...data.map(d => d[valueKey]));
  const mag = Math.pow(10, Math.floor(Math.log10(max / 4)));
  const step = [1, 2, 5, 10].map(m => m * mag).find(s => Math.ceil(max / s) <= 6) || 10 * mag;
  const n = Math.ceil(max / step), top = n * step;
  const svg = el("svg", {viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": target.dataset.label});
  const y = v => T + (H - T - B) * (1 - v / top);
  for (let i = 0; i <= n; i++) {
    const v = step * i;
    el("line", {class: "grid", x1: L, x2: W - R, y1: y(v), y2: y(v)}, svg);
    el("text", {x: L - 8, y: y(v) + 4, "text-anchor": "end"}, svg).textContent = fmt(v);
  }
  const band = (W - L - R) / data.length, bw = 24;
  data.forEach((d, i) => {
    const cx = L + band * i + band / 2, y0 = y(0), y1 = y(d[valueKey]), h = y0 - y1, r = Math.min(4, h);
    const path = `M${cx - bw/2},${y0} V${y1 + r} Q${cx - bw/2},${y1} ${cx - bw/2 + r},${y1} H${cx + bw/2 - r} Q${cx + bw/2},${y1} ${cx + bw/2},${y1 + r} V${y0} Z`;
    hover(el("path", {class: "mark", d: path}, svg), tipFn(d));
    el("text", {class: "val", x: cx, y: y1 - 6, "text-anchor": "middle"}, svg).textContent = fmt(d[valueKey], decimals);
    el("text", {x: cx, y: H - B + 18, "text-anchor": "middle"}, svg).textContent = d.c === 1 ? "1 user" : d.c + " users";
  });
  target.appendChild(svg);
}

function costChart(target, steps) {
  const W = 640, rowH = 30, L = 232, R = 76, T = 6, H = T + rowH * steps.length + 8;
  const max = Math.max(0.5, Math.ceil(Math.max(...steps.map(d => d.h)) * 1.15 * 2) / 2);
  const svg = el("svg", {viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "GPU-hours per job"});
  const x = v => L + (W - L - R) * v / max;
  (max <= 1 ? [0, 0.25, 0.5, 0.75, 1] : [0, 1, 2]).filter(v => v <= max).forEach(v => el("line", {class: "grid", x1: x(v), x2: x(v), y1: T, y2: H - 8}, svg));
  steps.forEach((d, i) => {
    const yc = T + rowH * i + rowH / 2, bh = 16, w = Math.max(2, x(d.h) - x(0)), r = Math.min(4, w);
    el("text", {x: L - 10, y: yc + 4, "text-anchor": "end"}, svg).textContent = d.s;
    const path = `M${x(0)},${yc - bh/2} H${x(0) + w - r} Q${x(0) + w},${yc - bh/2} ${x(0) + w},${yc - bh/2 + r} V${yc + bh/2 - r} Q${x(0) + w},${yc + bh/2} ${x(0) + w - r},${yc + bh/2} H${x(0)} Z`;
    hover(el("path", {class: "mark", d: path}, svg), `${d.s}: ${fmt(d.h, 2)} GPU-hours`);
    el("text", {class: "val", x: x(0) + w + 8, y: yc + 4}, svg).textContent = fmt(d.h, 2);
  });
  target.appendChild(svg);
}

// Scatter: x = GPU-hours per 1M output tokens at 64 users (log), y = single-user tok/s.
function scatter(target, current) {
  const pts = MODELS.map(m => ({k: m.key, label: m.label, x: m.gph1m, y: m.tok1, gpus: m.gpus, agg: m.tok64}));
  const W = 480, H = 340, L = 48, R = 16, T = 16, B = 52;
  const lo = Math.pow(10, Math.floor(Math.log10(Math.min(...pts.map(p => p.x)) * 0.8)));
  const hi = Math.pow(10, Math.ceil(Math.log10(Math.max(...pts.map(p => p.x)) * 1.2)));
  const ymax = Math.ceil(Math.max(...pts.map(p => p.y)) / 50) * 50;
  const xs = v => L + (W - L - R) * (Math.log10(v) - Math.log10(lo)) / (Math.log10(hi) - Math.log10(lo));
  const ys = v => T + (H - T - B) * (1 - v / ymax);
  const svg = el("svg", {viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Single-user speed against GPU-hours per million output tokens"});
  for (let v = 0; v <= ymax; v += 50) {
    el("line", {class: "grid", x1: L, x2: W - R, y1: ys(v), y2: ys(v)}, svg);
    el("text", {x: L - 8, y: ys(v) + 4, "text-anchor": "end"}, svg).textContent = fmt(v);
  }
  [0.1, 0.2, 0.5, 1, 2, 5, 10, 20].filter(v => v >= lo && v <= hi).forEach(v => {
    el("line", {class: "grid", x1: xs(v), x2: xs(v), y1: T, y2: H - B}, svg);
    el("text", {x: xs(v), y: H - B + 18, "text-anchor": "middle"}, svg).textContent = v;
  });
  el("text", {x: (L + W - R) / 2, y: H - 8, "text-anchor": "middle"}, svg).textContent = "GPU-hours per 1M output tokens (1,024 in / 256 out per request)";
  el("text", {x: 12, y: (T + H - B) / 2, "text-anchor": "middle", transform: `rotate(-90 12 ${(T + H - B) / 2})`}, svg).textContent = "Single-user tok/s";
  // Labels: place right of the dot, or left near the right edge; nudge apart if two labels would overlap.
  const placed = [];
  pts.sort((a, b) => a.y - b.y).forEach(p => {
    const cx = xs(p.x), cy = ys(p.y), left = cx > W * 0.62;
    let ly = cy + 4;
    for (const q of placed) if (Math.abs(q.ly - ly) < 14 && Math.abs(q.cx - cx) < 150) ly = q.ly - 14;
    placed.push({cx, ly});
    const g = el("g", {style: "cursor:pointer"}, svg);
    el("circle", {cx, cy, r: 7, class: "dot" + (p.k === current ? " cur" : "")}, g);
    el("text", {class: "val", x: left ? cx - 12 : cx + 12, y: ly, "text-anchor": left ? "end" : "start"}, g).textContent = p.label;
    hover(g, `${p.label}: ${fmt(p.y, 0)} tok/s for one user; ${fmt(p.x, 2)} GPU-hours per 1M output tokens (${p.gpus} GPU${p.gpus > 1 ? "s" : ""}, ${fmt(p.agg, 0)} tok/s at 64 users; 1,024 in / 256 out per request)`);
    g.addEventListener("click", () => go(p.k));
  });
  target.appendChild(svg);
}

// ---- views ----------------------------------------------------------------
const TOK = "<strong>every request has 1,024 input tokens and 256 output tokens</strong> (4 input tokens per output token), 256 requests per run, random-token prompts, seed 0";
function fmtCmd(c) { return c.replace(/ (--[a-z0-9.-]+)/g, " \\\n  $1"); }
const CLONE = "git clone " + REPO + ".git && cd how-to-run-llm-on-isambard";

function overview() {
  const cheapest = MODELS.reduce((a, b) => a.gph1m < b.gph1m ? a : b), fastest = MODELS.reduce((a, b) => a.tok1 > b.tok1 ? a : b);
  const sorted = [...MODELS].sort((a, b) => a.gph1m - b.gph1m);
  const v = $("view");
  v.innerHTML = `
  <p class="sub">A practical guide to running large open-weight LLMs on Isambard-AI (GH200 GPUs) with vLLM: how it is done, what
    throughput to expect, and what node setup each model needs. ${MODELS.length} models measured on the same fixed workload with vLLM ${esc(MODELS[0].software.vllm)}.
    Pick a model above to see exactly how it was served.</p>
  <section class="tiles" aria-label="Headline numbers">
    <div class="tile"><div class="label">Models measured</div><div class="value">${MODELS.length}</div><p class="note">from ${fmt(Math.min(...MODELS.map(m => m.weights_gb)), 0)} GB to ${fmt(Math.max(...MODELS.map(m => m.weights_gb)), 0)} GB of weights</p></div>
    <div class="tile"><div class="label">Cheapest per token</div><div class="value">${esc(cheapest.label)}</div><p class="note">${fmt(cheapest.gph1m, 2)} GPU-hours per 1M output tokens on ${cheapest.gpus} GPU${cheapest.gpus > 1 ? "s" : ""}</p></div>
    <div class="tile"><div class="label">Fastest for one user</div><div class="value">${fmt(fastest.tok1, 0)} tok/s</div><p class="note">${esc(fastest.label)}, on ${fastest.gpus} GPUs</p></div>
  </section>
  <section class="card">
    <h2>Speed vs cost</h2>
    <p class="desc">Each dot is a model. Up is faster for one user. Left is cheaper: GPU-hours needed to generate one million output tokens with 64 users at once. The cost is measured on one fixed workload, so it is only comparable under it: ${TOK}. Formula: GPUs &divide; aggregate output tok/s &divide; 3,600 &times; 1,000,000. Click a dot to open that model.</p>
    <div id="c-scatter"></div>
  </section>
  <section class="card">
    <h2>All models</h2>
    <p class="desc">Sorted cheapest first. Click a row for how it was served. GPU-hours to reproduce = download + container build (shared) + one serve-and-benchmark run.</p>
    <div class="tablewrap"><table class="cmp">
      <thead><tr><th>Model</th><th>GPUs</th><th>Weights</th><th>1 user tok/s</th><th>64 users tok/s</th><th>GPU-h per 1M out tok</th><th>GPU-h to reproduce</th><th>Status</th></tr></thead>
      <tbody>${sorted.map(m => `<tr class="row" data-k="${m.key}"><td>${esc(m.label)}</td><td>${m.gpus}</td><td>${fmt(m.weights_gb, m.weights_gb < 100 ? 1 : 0)} GB</td><td>${fmt(m.tok1, m.tok1 < 10 ? 1 : 0)}</td><td>${fmt(m.tok64)}</td><td>${fmt(m.gph1m, 2)}</td><td>${fmt(m.gpu_hours.total, 2)}</td><td>${esc(m.status)}</td></tr>`).join("")}</tbody>
    </table></div>
  </section>
  <section class="card">
    <h2>How it is measured</h2>
    <p class="desc">One benchmark for every model: <code>vllm bench serve</code> with random prompts, ${TOK}. It is run at 1, 16 and 64 concurrent users (4 &times; concurrency requests each); the 64-user run is 256 requests, 262,144 input and 65,536 output tokens. GPU-hours come from Slurm accounting. Isambard-AI charges per GPU, so a model that fits on 1 GPU costs a quarter of a node. All runs: vLLM ${esc(MODELS[0].software.vllm)}, torch ${esc(MODELS[0].software.torch)}, CUDA ${esc(MODELS[0].software.cuda)}, one container image pinned by digest; each model pinned to a Hugging Face commit.</p>
  </section>
  <section class="card">
    <h2>What fits where</h2>
    <p class="desc">Measured setups, smallest first. Isambard charges per GPU, so use the fewest that fit: weights per GPU plus enough KV cache for the context you need.</p>
    <div class="tablewrap"><table class="cmp">
      <thead><tr><th>GPUs</th><th>Models that ran on this setup</th><th>Weights per GPU</th><th>262k contexts held</th></tr></thead>
      <tbody>${[...new Set(MODELS.map(m => m.gpus))].sort((a, b) => a - b).map(g => MODELS.filter(m => m.gpus === g).map((m, i, arr) => `<tr class="row" data-k="${m.key}"><td>${i === 0 ? g + (g > 4 ? " (" + m.nodes + " nodes)" : "") : ""}</td><td>${esc(m.label)}</td><td>${fmt(m.load.weights_gib_per_gpu || 0)} GiB</td><td>${fmt(m.load.max_concurrency_at_262144_ctx || 0, 1)}</td></tr>`).join("")).join("")}</tbody>
    </table></div>
  </section>
  <section class="card">
    <h2>The recipe in four steps</h2>
    <p class="desc">All heavy work runs in Slurm jobs, never on the login node (about 1 core and 4 GiB). Each model page shows its exact commands.</p>
    <ol class="notes">
      <li><strong>Download</strong> the weights to <code>$SCRATCHDIR</code> in a 1-GPU job with <code>hf download &lt;repo&gt; --revision &lt;commit&gt;</code> (about 1 GB/s).</li>
      <li><strong>Build</strong> an arm64 Apptainer image from the vLLM container, pinned by digest (once, about 20 minutes).</li>
      <li><strong>Serve</strong> with <code>srun apptainer exec --nv &hellip; vllm serve</code>, requesting only the nodes and GPUs the model needs. Across nodes: data-parallel + expert-parallel, tensor-parallel inside each node.</li>
      <li><strong>Benchmark</strong> with <code>vllm bench serve</code>: random prompts, 1,024 input and 256 output tokens, at 1, 16 and 64 concurrent users.</li>
    </ol>
    <p class="desc"><a href="${REPO}/blob/main/HOWTO.md">The full guide: Isambard-AI facts, choosing a node setup, what every flag means, troubleshooting &rarr;</a> &middot; <a href="${REPO}">the scripts (a worked example) &rarr;</a></p>
  </section>
  <section class="card">
    <h2>Caveats</h2>
    <ul class="caveats">
      <li>Short prompts only. Nothing here measures a 250k-token prompt (prefill time or long-context decode speed), and a different input/output ratio would change the cost figure.</li>
      <li>Repeatability: each model was run twice. Seven of nine agreed within about 4% (most within 1%) at every concurrency; DeepSeek (+14% at 16 users) and GLM (up to +23% at 64 users, eager mode) varied more, so treat the two-node numbers as roughly &plusmn;20%. The numbers shown are the final run.</li>
          </ul>
  </section>`;
  scatter($("c-scatter"), null);
  v.querySelectorAll("tr.row").forEach(r => r.addEventListener("click", () => go(r.dataset.k)));
}

function detail(m) {
  const r = m.results, top = r[2], load = m.load, gh = m.gpu_hours;
  const bench = r.map(x => ({c: x.concurrency, req: x.requests, tps: x.output_tok_s, ttft: x.mean_ttft_ms, tpot: x.mean_tpot_ms}));
  const steps = [{s: "1. Download weights (one-off)", h: gh.download}, {s: "2. Build container (shared)", h: gh.build}, {s: `3. Serve + benchmark, ${m.gpus} GPU${m.gpus > 1 ? "s" : ""}`, h: gh.serve}];
  const prov = m.provenance && m.provenance.scripts_commit
    ? `Scripts: ${esc(m.provenance.scripts_commit)} (run before the one-command pipeline; numbers copied from job logs).`
    : "Run with the one-command pipeline; results written by <code>collect_results.py</code> from the saved benchmark JSON.";
  const ctx = load.max_concurrency_at_262144_ctx, kv = load.kv_cache_tokens;
  $("view").innerHTML = `
  <p class="sub">${m.description} On <strong>${m.nodes > 1 ? m.nodes + " nodes, " : ""}${m.gpus} GPU${m.gpus > 1 ? "s" : ""} (GH200)</strong>, vLLM ${esc(m.software.vllm)}, ${esc(m.date)}. <a href="https://huggingface.co/${m.hf}">Model on Hugging Face &rarr;</a></p>
  <section class="tiles" aria-label="Headline numbers">
    <div class="tile"><div class="label">Single user, output speed</div><div class="value">${fmt(m.tok1, m.tok1 < 10 ? 1 : 0)} tok/s</div><p class="note">time to first token ${fmt(r[0].mean_ttft_ms, r[0].mean_ttft_ms < 1000 ? 0 : 0)} ms</p></div>
    <div class="tile"><div class="label">Aggregate at 64 concurrent users</div><div class="value">${fmt(m.tok64)} tok/s</div><p class="note">each user sees ~${fmt(1000 / top.mean_tpot_ms)} tok/s</p></div>
    <div class="tile"><div class="label">Cost per 1M output tokens</div><div class="value">${fmt(m.gph1m, 2)} GPU-h</div><p class="note">at 64 users, 1,024 in / 256 out per request</p></div>
  </section>
  <section class="card"><h2>How it was served</h2>
    <p class="desc">What the job actually ran, recorded by the run itself. Slurm request: <code>--nodes=${m.nodes} --gpus-per-node=${m.gpus_per_node} --time=${esc(m.time_cap)}</code>. Everything runs inside the container, started once per node:</p>
<pre>module load brics/nccl brics/apptainer-multi-node   # Slingshot RDMA env for multi-node NCCL
srun --kill-on-bad-exit=1 --export=ALL \\
  apptainer exec --nv --bind $SCRATCHDIR --bind $REPO_DIR vllm-0.33.0-arm64.sif \\
  scripts/node_entry.sh   # sets the environment below, then starts vLLM</pre>
    ${m.env && Object.keys(m.env).length ? `<p class="desc">Environment set inside the container:</p><pre>${esc(Object.entries(m.env).map(([k, v]) => k + "=" + v).join("\n"))}</pre>` : ""}
    ${m.serve_command ? `<p class="desc">${m.nodes > 1 ? "Head node (node 0), which also runs the benchmark" : "The server"}:</p><pre>${esc(fmtCmd(m.serve_command))}</pre>` : ""}
    ${m.worker_command ? `<p class="desc">Other nodes (data-parallel workers):</p><pre>${esc(fmtCmd(m.worker_command))}</pre>` : ""}
    ${m.notes.length ? `<h2 style="margin-top:12px">What we had to do for this model, and why</h2><ul class="notes">${m.notes.map(n => `<li>${n}</li>`).join("")}</ul>` : ""}
    <p class="desc">Flags are explained in the <a href="${REPO}/blob/main/HOWTO.md#what-the-vllm-flags-mean">guide</a>.</p>
  </section>
  <section class="card"><h2>Reproduce it (worked example)</h2>
    <p class="desc">The repo\'s scripts are an example of the steps, not a tool you must use. Exact commands for this model on an Isambard-AI Phase 2 login node. Requests ${m.nodes} node${m.nodes > 1 ? "s" : ""} &times; ${m.gpus_per_node} GPU${m.gpus_per_node > 1 ? "s" : ""}, job time cap ${esc(m.time_cap)}. The first model you run also builds the shared container (about 20 minutes, ${fmt(gh.build, 2)} GPU-hours).</p>
<pre>${esc(CLONE)}
MODEL=${m.key} bash scripts/run.sh
MODEL=${m.key} python3 scripts/collect_results.py   # after the serve job finishes</pre>
    <p class="desc"><a href="${REPO}/blob/main/HOWTO.md#${m.key}">This model in the guide &rarr;</a> &middot; <a href="${REPO}/blob/main/scripts/models/${m.key}.env">its settings file &rarr;</a> &middot; <a href="${REPO}/blob/main/results/${m.key}_benchmarks.json">raw results &rarr;</a></p>
  </section>
  <section class="card"><h2>Aggregate output throughput</h2>
    <p class="desc">Total tokens generated per second across all users, by number of concurrent requests.</p><div id="c-throughput" data-label="Aggregate output throughput"></div></section>
  <section class="card"><h2>Speed each user sees</h2>
    <p class="desc">Decode speed per request (1000 / mean time per output token). Falls as the server gets busier.</p><div id="c-peruser" data-label="Speed each user sees"></div></section>
  <section class="card"><h2>Latency and the numbers behind the charts</h2>
    <div class="tablewrap"><table id="t-bench"></table></div>
    <p class="desc" style="margin-top:8px">Workload: <code>vllm bench serve</code>, random prompts, 1,024 input and 256 output tokens per request, 4 &times; concurrency requests per level (the 64-user run is ${fmt(m.cost_metric.run_requests)} requests: ${fmt(m.cost_metric.run_input_tokens)} input and ${fmt(m.cost_metric.run_output_tokens)} output tokens). One run, no repeats.</p></section>
  <section class="card"><h2>What it costs you: about ${fmt(gh.total, 1)} GPU-hours to get running</h2>
    <p class="desc">GPU-hours for the three jobs in the guide, from Slurm accounting (1 GPU = 0.25 node-hours, so ${fmt(gh.total, 1)} GPU-hours = ${fmt(gh.total / 4, 1)} node-hours). Isambard charges per GPU. The download is one-off per model and the container is shared. Serving this model costs ${m.gpus} GPU-hour${m.gpus > 1 ? "s" : ""} per hour the job runs.</p>
    <div id="c-cost"></div>
    <details><summary>Table view</summary><div class="tablewrap"><table id="t-cost"></table></div></details></section>
  <section class="card"><h2>Setup and caveats</h2>
    <p class="desc">${m.layout}. Weights ${load.weights_gib_per_gpu ? fmt(load.weights_gib_per_gpu, 1) + " GiB per GPU, " : ""}${load.load_seconds ? "loaded in about " + fmt(load.load_seconds) + " s. " : ""}${kv ? "KV cache " + fmt(kv) + " tokens, " + fmt(ctx, 1) + " concurrent 262k-token contexts." : ""}</p>
    <ul class="caveats">${[...m.caveats,
      "Short prompts only. Nothing here measures a 250k-token prompt.", m.repeat_pct ? `Run twice: the final run\'s output tok/s differed from the earlier run by ${m.repeat_pct.map(x => (x > 0 ? "+" : "") + x + "%").join(" / ")} at 1 / 16 / 64 users. The numbers shown are the final run.` : "One run, no repeats, so no error bars."].map(c => `<li>${c}</li>`).join("")}</ul>
    <p class="meta">Revision <code>${esc(m.revision.slice(0, 12))}</code> &middot; ${prov}</p></section>`;
  columns($("c-throughput"), bench, "tps", d => `${d.c} concurrent: ${fmt(d.tps, 1)} tok/s aggregate`, m.tok1 < 20 ? 1 : 0);
  columns($("c-peruser"), bench.map(d => ({...d, pu: 1000 / d.tpot})), "pu", d => `${d.c} concurrent: ${fmt(d.pu, 1)} tok/s per user`, m.tok1 < 20 ? 1 : 0);
  $("t-bench").innerHTML = "<thead><tr><th>Concurrent users</th><th>Requests</th><th>Aggregate tok/s</th><th>Per-user tok/s</th><th>TTFT (ms)</th><th>TPOT (ms)</th></tr></thead><tbody>" +
    bench.map(d => `<tr><td>${d.c}</td><td>${d.req}</td><td>${fmt(d.tps, 1)}</td><td>${fmt(1000 / d.tpot, 1)}</td><td>${fmt(d.ttft, 0)}</td><td>${fmt(d.tpot, 1)}</td></tr>`).join("") + "</tbody>";
  costChart($("c-cost"), steps);
  $("t-cost").innerHTML = "<thead><tr><th>Job</th><th>GPU-hours</th></tr></thead><tbody>" + steps.map(d => `<tr><td>${d.s}</td><td>${fmt(d.h, 2)}</td></tr>`).join("") +
    `<tr><td><strong>Total</strong></td><td><strong>${fmt(gh.total, 2)}</strong></td></tr></tbody>`;
}

// ---- routing --------------------------------------------------------------
function current() { const k = new URLSearchParams(location.search).get("model"); return byKey[k] ? k : "overview"; }
function go(k) { history.pushState(null, "", k === "overview" ? location.pathname : "?model=" + k); show(); scrollTo(0, 0); }
function show() {
  const cur = current();
  $("tabs").innerHTML = `<button class="home" role="tab" data-k="overview" aria-selected="${cur === "overview"}">Overview</button>` +
    MODELS.map(m => `<button role="tab" data-k="${m.key}" aria-selected="${cur === m.key}">${esc(m.label)}</button>`).join("");
  $("tabs").querySelectorAll("button").forEach(b => b.onclick = () => go(b.dataset.k));
  if (cur === "overview") { document.title = "LLMs on Isambard-AI"; overview(); }
  else { document.title = byKey[cur].label + " on Isambard-AI"; detail(byKey[cur]); }
}
addEventListener("popstate", show);
show();
</script>
</body>
</html>
